<style>
:root {
  --night: #0e0f2e; --night-2: #1b1d52; --violet: #6c4bff; --pink: #ff4d8d; --gold: #ffb81f;
  --page: #f5f5fa; --card: #ffffff; --ink: #0e0f2e; --muted: #585d7e; --line: #e2e3f0; --link: #4a35d6;
  --display: "Bricolage Grotesque", "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
  --glass: rgba(255,255,255,.09); --glass-line: rgba(255,255,255,.18);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 1.08rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }

button { font: inherit; }
h1, h2 { overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* ---------- home hero ---------- */

  background: radial-gradient(52rem 28rem at 88% -12%, rgba(108,75,255,.6), transparent 62%),

.hero h1 { font-family: var(--display); font-weight: 800; margin: 0; font-size: clamp(2.5rem, 8vw, 5.2rem); line-height: 1.02; letter-spacing: -0.035em; max-width: 12em; }
.hl { background: linear-gradient(100deg, var(--gold), #ff8a5b 60%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.hero > .wrap > p { margin: 20px 0 32px; max-width: 30em; color: #cdd0ee; font-size: 1.2rem; }
.search { position: relative; max-width: 680px; }

.search input::placeholder { color: #70759a; }

.search input:focus { outline: none; border-color: var(--gold); }
.clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 1.6rem; line-height: 1; cursor: pointer; border-radius: 50%; }

/* ---------- buttons, From / To ---------- */

.where.two { padding: 18px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 24px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.where b { color: #fff; font-weight: 600; }
.where .from { flex: 1 1 220px; min-width: 0; padding: 12px 18px; font: inherit; font-size: 1rem; color: var(--ink); background: #fff; border: 2px solid transparent; border-radius: 999px; }
.where .from:focus { outline: none; border-color: var(--gold); }
.where.two .fld { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }

.where.two label { display: flex; align-items: center; gap: 6px; padding-left: 6px; font-size: .86rem; color: #cdd0ee; }
.where.two label svg { width: 14px; height: 14px; fill: none; stroke: var(--gold); stroke-width: 2.2; }
.where.two label svg.dot { fill: var(--gold); stroke: none; }
.where .msg { flex-basis: 100%; margin: 0; font-size: .92rem; color: #ffd98a; }
.where .msg:empty { display: none; }
.btn { padding: 12px 22px; font: inherit; font-weight: 600; color: var(--night); background: linear-gradient(100deg, var(--gold), #ff9a4d); border: 2px solid transparent; border-radius: 999px; cursor: pointer; }
.btn.ghost { background: transparent; color: #f4f4ff; border-color: var(--glass-line); }

.btn svg { width: 18px; height: 18px; margin: -3px 8px 0 0; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.linkbtn { background: none; border: 0; padding: 4px; font: inherit; color: var(--gold); text-decoration: underline; cursor: pointer; }

.route b { color: #fff; font-weight: 600; }

/* ---------- 3-dot menu ---------- */
.menu-wrap { position: absolute; top: 14px; right: 14px; z-index: 5; }
.kebab { width: 44px; height: 44px; border: 1px solid var(--glass-line); border-radius: 50%; background: var(--glass); color: #f4f4ff; font-size: 1.6rem; line-height: 1; cursor: pointer; backdrop-filter: blur(10px); }

.hero .menu-title { margin: 6px 10px 4px; max-width: none; font-size: .85rem; font-weight: 600; color: var(--muted); }

.menu li { display: flex; align-items: center; }
.hitem { flex: 1; min-width: 0; padding: 9px 12px; text-align: left; font: inherit; font-size: 1rem; color: var(--ink); background: none; border: 0; border-radius: 12px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.menu li.menu-empty { display: block; margin: 4px 10px 10px; font-size: .95rem; color: var(--muted); }
.menu-clear { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; text-align: left; font: inherit; font-weight: 600; color: #b3261e; background: none; border: 0; border-top: 1px solid var(--line); cursor: pointer; }
.menu-clear:disabled { color: #9a9ab0; cursor: default; }

/* ---------- results grid: photo-first cards ---------- */
.results { padding: 44px 0 80px; }
.count { margin: 0 0 20px; color: var(--muted); font-size: .98rem; }
.hist { margin: 0 0 24px; }
.hist .count { margin-bottom: 8px; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 16px; font: inherit; font-size: .95rem; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--violet); color: var(--link); }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.tile { position: relative; display: block; aspect-ratio: 4 / 5; min-height: 280px; border-radius: 28px; overflow: hidden; text-decoration: none; color: #fff; isolation: isolate;
  background: linear-gradient(150deg, #3a2bb8, var(--night-2) 60%, #1a1040); box-shadow: 0 10px 30px rgba(14,15,46,.18); }
.tile.soon { background: var(--line); color: var(--ink); box-shadow: none; }
.t-photo { position: absolute; inset: 0; z-index: -2; }
.t-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tile::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(14,15,46,0) 35%, rgba(14,15,46,.88) 100%); }
.t-body { position: absolute; inset: auto 0 0 0; padding: 20px; }
.tile h2 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.05; letter-spacing: -0.03em; margin: 0; }
.tile .state { margin: 4px 0 0; font-size: .95rem; color: #e0e2f7; }
.tile .hit { margin: 8px 0 0; font-size: .88rem; color: #ffe1a0; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pill { display: inline-block; padding: 4px 12px; font-size: .85rem; font-weight: 600; border-radius: 999px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pill.dist { background: var(--gold); border-color: transparent; color: var(--night); }
.t-go { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.t-go svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: no-preference) {
  .tile { transition: transform .25s, box-shadow .25s; }

  a.tile:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(14,15,46,.3); }
  a.tile:hover .t-photo img { transform: scale(1.06); }
}
.empty { padding: 8px 0 28px; max-width: 34em; color: var(--muted); }
.empty b { color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; display: block; margin-bottom: 6px; }

/* ---------- city page ---------- */
.city-head { position: relative; isolation: isolate; color: #f4f4ff; padding: 84px 0 64px; min-height: 520px; display: flex; align-items: flex-end; overflow: hidden;

.city-head > .wrap { width: 100%; }

.ch-bg figcaption a { color: #fff; }
.city-head::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(14,15,46,.45) 0%, rgba(14,15,46,.2) 30%, rgba(14,15,46,.9) 100%); }
.back { position: absolute; top: 20px; left: max(24px, calc((100vw - 1120px) / 2 + 24px)); display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; color: #fff; text-decoration: none; font-weight: 600; font-size: .95rem; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

.city-head .alt { font-family: "Noto Serif Devanagari", var(--display); font-weight: 600; color: var(--gold); font-size: 1.4rem; margin: 0 0 2px; }

.city-head .sub { margin: 18px 0 0; max-width: 34em; font-size: 1.15rem; color: #dcdff5; }
.city-head .sub b { color: #fff; font-weight: 600; }
.jump { position: sticky; top: 0; z-index: 4; background: rgba(245,245,250,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.jump-list { display: flex; gap: 8px; max-width: 1120px; margin: 0 auto; padding: 10px 24px; overflow-x: auto; scrollbar-width: none; }

}

// ============ search ============
function match(c, q) {
  if (!q) return { ok: true };
  const n = norm(q);
  if (norm(c.name).includes(n) || norm(c.state).includes(n)) return { ok: true };
  if ((c.aka || []).some(a => norm(a).includes(n))) return { ok: true };
  const p = (c.places || []).find(p => norm(p.name).includes(n));
  if (p) return { ok: true, hit: p.name };
  return { ok: false };
}

// A page with a map position must lie within about 220 km of the city (Pangong Lake, the farthest place we list, is about 160 km away).
// A page without one is judged by its short description ("Fort in Agra, India").
function placeVerdict(pg, ctx) {
  const co = pg.coordinates && pg.coordinates[0];
  if (co) return distKm({ lat: ctx.lat, lng: ctx.lng }, { lat: co.lat, lng: co.lon }) <= 220;

    const out = pg => ({ src: pg.thumbnail.source, file: pg.pageimage, w: pg.thumbnail.width, h: pg.thumbnail.height });
    if (!cands.length) return null;

    ? [[kind, q], ["s", (ctx && ctx.names[0] ? ctx.names[0] : q) + " India"]]
    : [["s", q], ["s", plain + st], ["s", chk], ["t", plain]].filter((x, i, a) => x[1] && a.findIndex(y => y[0] === x[0] && y[1] === x[1]) === i);
  const plainQ = kind === "t" ? ((ctx && ctx.names[0]) || q) + " India landmark" : plain + (ctx ? " " + ctx.names[0] : "");
  const run = i => wikiOnce(tries[i][0], tries[i][1], chk || q, ctx).then(r => r || (i + 1 < tries.length ? run(i + 1) : null));
  const viaCommons = r => r || commonsOnce(plainQ, chk || q, ctx, false)
    .then(c => c || commonsOnce(kind === "t" ? q : plain, chk || q, ctx, false))
    .then(c => c || (kind === "t" ? null : openverseOnce(plainQ, chk, ctx)));
  return phWait[key] = run(0).then(viaCommons).then(res => {
    phCache[key] = res;
    try { localStorage.setItem(PH_KEY, JSON.stringify(phCache)); } catch (_) {}
    return res;
  }).catch(() => null);   // offline or blocked: not cached, so it is tried again next time
}
const wikiFile = f => "https://en.wikipedia.org/wiki/File:" + encodeURIComponent(f);
// Your own photos come first: put  photos/agra-main.jpg  and  photos/agra-1.jpg ... agra-10.jpg  next to index.html. If a file exists, it is used.
const LOCAL_CREDIT = "";   // optional line shown under your own photos, e.g. "Photo: Vikas"
function localPhoto(el) {
  const c = el.dataset.city; if (!c) return Promise.resolve(null);
  const name = el.dataset.ph === "t" ? c + "-main" : c + "-" + el.dataset.n;
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res({ src: "photos/" + name + ".jpg", file: name + ".jpg", local: true });
    im.onerror = () => res(null);
    im.src = "photos/" + name + ".jpg";
  });
}
function hydratePhotos(root) {
  root.querySelectorAll("[data-ph]").forEach(el => {
    const cc = CITIES.find(c => c.id === el.dataset.city);
    localPhoto(el).then(lp => lp || wikiPhoto(el.dataset.ph, el.dataset.q, el.dataset.chk || "", cc ? cityCtx(cc) : null)).then(r => {
      const none = () => { const sp = el.querySelector(".ph span"); if (sp) sp.textContent = "No free photo found yet"; };
      if (!r) { if (el.isConnected) none(); return; }
      if (!el.isConnected) return;
      const img = new Image();
      img.onerror = none;
      img.alt = el.dataset.alt || "";
      img.onload = () => {
        if (!el.isConnected) return;
        const credit = r.local ? (LOCAL_CREDIT ? `<figcaption>${esc(LOCAL_CREDIT)}</figcaption>` : "") : r.credit ? `<figcaption>${r.credit}</figcaption>` : `<figcaption>Photo: <a href="${esc(r.page || wikiFile(r.file))}" target="_blank" rel="noopener">Wikipedia / Wikimedia Commons</a> (author and licence on that page)</figcaption>`;
        el.innerHTML = "";
        el.appendChild(img);
        if (el.dataset.as !== "tile") el.insertAdjacentHTML("beforeend", credit);
        el.classList.add("has-photo");
      };
      img.src = r.src;
    });
  });
}
function kmShort(km) {
  if (km < 10) return "<10 km";
  const step = km < 100 ? 5 : 10;
  return "~" + (Math.round(km / step) * step).toLocaleString("en-IN") + " km";
}
function tileHTML(c, m, km) {
  const arrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';
  const body = `<div class="t-photo" data-ph="t" data-city="${c.id}" data-q="${esc(wikiName(c))}" data-as="tile" data-alt="${esc(c.name)}"></div>
    <div class="t-body"><h2>${esc(c.name)}</h2><p class="state">${esc(c.state)}</p>
      ${m && m.hit ? `<p class="hit">Includes ${esc(m.hit)}</p>` : ""}
      <div class="t-meta"><span class="pill">${ready(c) ? c.places.length + " places" : "Coming soon"}</span>${km != null ? `<span class="pill dist">${kmShort(km)} &middot; ${timeShort(km)}</span>` : ""}</div></div>`;
  return ready(c)
    ? `<li><a class="tile ready" href="#/${c.id}">${body}<span class="t-go" aria-hidden="true">${arrow}</span></a></li>`
    : `<li><div class="tile soon">${body}</div></li>`;
}
function drawGrid() {
  const grid = document.getElementById("grid"), count = document.getElementById("count"), empty = document.getElementById("empty");
  document.getElementById("clear").hidden = !query;
  const q = query.trim();
  const trip = parseTrip(q);
  if (trip) {
    grid.innerHTML = ""; count.textContent = "Distance";
    empty.innerHTML = tripCard(trip.a, trip.b);
    return;
  }
  if (!q && origin) {   // a starting point is set: show the nearest cities straight away
    const near = CITIES.filter(c => ready(c) && c.lat).map(c => ({ c, km: distKm(origin, c) }))
      .sort((a, b) => a.km - b.km).slice(0, 4);
    count.textContent = `Nearest to ${fromName()}`;
    grid.innerHTML = near.map(({ c, km }) => tileHTML(c, null, km)).join("");
    hydratePhotos(grid);
    empty.innerHTML = `<div class="empty">Search above to see how far any other city is.</div>`;
    return;
  }
  if (!q) {   // nothing typed yet: no city list
    grid.innerHTML = ""; count.textContent = "";
    empty.innerHTML = `<div class="empty"><b>Where do you want to go?</b>Type the name of a city, or a famous place you want to visit. To check a distance, type something like \u201CBanaras to Mumbai\u201D.</div>`;
    return;
  }
  const withKm = c => origin && c.lat ? distKm(origin, c) : null;
  const found = CITIES.map(c => ({ c, m: match(c, q), km: withKm(c) })).filter(x => x.m.ok)
    .sort((a, b) => (ready(b.c) - ready(a.c)) || (a.km != null && b.km != null ? a.km - b.km : a.c.name.localeCompare(b.c.name)));

  count.textContent = `${found.length} ${found.length === 1 ? "city" : "cities"} for “${q}”`
    + (origin && found.some(x => x.km != null) ? ", nearest first" : "");
  grid.innerHTML = found.map(({ c, m, km }) => tileHTML(c, m, km)).join("");
  hydratePhotos(grid);

  empty.innerHTML = found.length ? "" : `
    <div class="empty"><b>No city called “${esc(q)}” yet.</b>
    Check the spelling, or try a nearby city or a famous place. We are adding more cities over time.</div>`;
}

// ============ city page ============
function renderCity(c) {
  document.title = `${c.name}: Top ${c.places.length} Places to Visit`;
  const items = c.places.map((p, i) => {
    const fig = `<figure class="photo" data-ph="s" data-n="${i + 1}" data-city="${c.id}" data-q="${esc(p.name.replace(/\(.*?\)/g, "").trim() + " " + wikiName(c))}" data-chk="${esc(p.name)}" data-alt="${esc(p.name)}"><div class="ph" role="img" aria-label="Photo loading"><span>Finding a reusable photo…</span></div></figure>`;
    return `<li class="place" id="p${i}">${fig}<div class="copy">
      <span class="num" aria-hidden="true">${String(i + 1).padStart(2, "0")}</span>
      <h2>${esc(p.name)}</h2><p>${esc(p.text)}</p></div></li>`;
  }).join("");

  $app.innerHTML = `
    <header>
      <div class="city-head"><figure class="ch-bg" data-ph="t" data-city="${c.id}" data-q="${esc(wikiName(c))}" data-as="hero" data-alt="${esc(c.name)}"></figure><a class="back" href="#/">&larr; All cities</a><div class="wrap">
        ${c.local ? `<p class="alt" lang="hi">${esc(c.local)}</p>` : ""}
        <h1>${esc(c.name)}</h1>
        <p class="sub">${c.intro}</p>
        ${routeHTML(c)}
      </div></div>
      <div class="river" aria-hidden="true"></div>
    </header>
    <nav class="jump" aria-label="Jump to a place"><div class="jump-list">${c.places.map((p, i) => `<button type="button" class="jump-chip" data-jump="p${i}"><b>${String(i + 1).padStart(2, "0")}</b>${esc(p.name)}</button>`).join("")}</div></nav>
    <main><ol class="places">${items}</ol></main>
    <div class="note"><div>
      <p>Timings, entry rules and prices change, and festival days can change everything, so check locally before you go.</p>
      <p>Photos come from Wikipedia and Wikimedia Commons (free-licence images only) and belong to their photographers. Each credit links to the photo's page, which shows the author and licence. If a photo is missing or looks wrong, it is the automatic search, so please tell us.</p>
      <p>Distances are straight-line estimates. Your starting point is saved only in this browser. The Google Maps link shows the real road distance and time.</p>
      <p><a href="#/">&larr; Back to all cities</a></p>
    </div></div>`;
  bindWhere($app);
  $app.querySelector(".jump-list").onclick = e => {
    const b = e.target.closest("[data-jump]"); if (!b) return;
    const t = document.getElementById(b.dataset.jump); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  hydratePhotos($app);
}
function routeHTML(c) {
  if (!c.lat) return "";
  if (!origin) return whereHTML("city");
  return `<p class="route">From <b>${esc(fromName())}</b>: <b>${fmtKm(distKm(origin, c))}</b> in a straight line, and ${fmtTime(distKm(origin, c))} by road (rough estimate).
    <a href="${esc(mapsLink(c))}" target="_blank" rel="noopener">See the driving route and time in Google Maps</a>
    &middot; <button type="button" class="linkbtn" data-act="change">Change</button></p>`;
}

// ============ home page: changing background photos (a different set of cities on every visit) ============
let heroTimer = null, heroRun = 0;
function stopHero() { clearInterval(heroTimer); heroTimer = null; heroRun++; }
function startHero() {
  stopHero();
  const run = heroRun, bg = document.getElementById("hero-bg"), credit = document.getElementById("hero-credit");
  if (!bg) return;
  const order = CITIES.filter(ready).sort(() => Math.random() - 0.5).slice(0, 8);
  const slidesOn = [];
  let cur = -1;
  const show = i => {
    if (run !== heroRun) return;
    slidesOn.forEach((sl, k) => sl.el.classList.toggle("on", k === i));
    cur = i;
    credit.href = wikiFile(slidesOn[i].file); credit.hidden = false;
  };
  order.forEach(c => {
    localPhoto({ dataset: { city: c.id, ph: "t" } }).then(lp => lp || wikiPhoto("t", wikiName(c), "", cityCtx(c))).then(r => {
      if (!r || run !== heroRun || (r.w && r.h && r.w / r.h < 0.65)) return;   // allow more real city photos; CSS crops to the hero
      const img = new Image();
      img.alt = ""; img.className = "slide";
      img.onerror = () => { if (img.src !== r.src) img.src = r.src; };         // if the big size is missing, use the normal one
      img.onload = () => {
        if (run !== heroRun || !bg.isConnected || img.dataset.done) return;
        img.dataset.done = "1";
        bg.appendChild(img);
        slidesOn.push({ el: img, file: r.file });
        if (slidesOn.length === 1) { requestAnimationFrame(() => show(0)); }
        if (slidesOn.length === 2 && !heroTimer) heroTimer = setInterval(() => show((cur + 1) % slidesOn.length), 6500);
      };
      img.src = r.local ? r.src : r.src.replace(/\/\d+px-/, "/1280px-");
    });
  });
}

// ============ routing (works on Netlify with no extra setup) ============
let forcedHash = null;   // used when the browser will not let us change the address (some preview windows)
// A test page for photos: open  ...index.html#/photo-test  to see what is working and what is not.
function renderPhotoTest() {
  document.title = "Photo test";
  $app.innerHTML = `<main class="results"><div class="wrap"><p><a href="#/">&larr; Home</a></p><h1 style="font-family:var(--display);letter-spacing:-.03em">Photo test</h1>
    <p class="count">Take a screenshot of this page and send it. Nothing here is saved.</p><pre id="pt" style="white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:.95rem"></pre></div></main>`;
  const out = document.getElementById("pt"), say = t => { out.textContent += t + "\n"; };
  let framed = false; try { framed = window.top !== window; } catch (_) { framed = true; }
  say("Opened from: " + location.protocol + "//" + (location.host || "(a file on this device)"));
  say("Inside another page or preview window: " + (framed ? "YES (this can block the internet)" : "no"));
  say("Browser online: " + navigator.onLine + "\n");
  const get = u => fetch(u).then(async r => ({ status: r.status, j: await r.json() }));
  const ag = CITIES.find(c => c.id === "agra");
  say("1. Wikipedia reachable? ...");
  get(API + "redirects=1&prop=pageimages&piprop=thumbnail%7Cname&pilicense=free&pithumbsize=900&titles=Taj%20Mahal")
    .then(r => { const pg = Object.values((r.j.query || {}).pages || {})[0] || {}; say("   YES. status " + r.status + ", page: " + pg.title + ", photo: " + (pg.pageimage || "none")); })
    .catch(e => say("   NO. Error: " + e.message))
    .then(() => { say("2. Commons reachable? ...");
      return get("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=5&gsrsearch=Mani%20Parvat%20Ayodhya"); })
    .then(r => { const t = Object.values((r.j.query || {}).pages || {}).map(p => p.title); say("   YES. status " + r.status + ", files found: " + (t.length ? t.join(" | ") : "none")); })
    .catch(e => say("   NO. Error: " + e.message))
    .then(() => { say("2b. Openverse reachable? ..."); return get("https://api.openverse.org/v1/images/?page_size=3&license_type=commercial&q=Mani%20Parvat%20Ayodhya"); })
    .then(r => say("   YES. status " + r.status + ", photos found: " + (r.j.results ? r.j.results.length : "?")))
    .catch(e => say("   NO. Error: " + e.message))
    .then(() => { say("3. Full photo search for Taj Mahal, Agra ..."); return wikiOnce("s", "Taj Mahal Agra", "Taj Mahal", cityCtx(ag)); })
    .then(r => say("   Result: " + (r ? "photo found (" + r.file + ")" : "nothing found")))
    .catch(e => say("   Error: " + e.message))
    .then(() => { say("4. Full photo search for Mani Parvat, Ayodhya ..."); const ay = CITIES.find(c => c.id === "ayodhya"); return wikiOnce("s", "Mani Parvat Ayodhya", "Mani Parvat", cityCtx(ay)).then(r => r || commonsOnce("Mani Parvat ayodhya", "Mani Parvat", cityCtx(ay), false)); })
    .then(r => say("   Result: " + (r ? "photo found (" + r.file + ")" : "nothing found")))
    .catch(e => say("   Error: " + e.message))
    .then(() => say("\nDone."));
}
function renderPhotoNames(id) {
  const c = CITIES.find(x => x.id === id);
  document.title = "Photo file names";
  if (!c) { $app.innerHTML = `<main class="results"><div class="wrap"><p><a href="#/">&larr; Home</a></p><h1>Photo file names</h1><p>Open  #/photo-names/agra  with a city id, for example agra, banaras or jaipur.</p></div></main>`; return; }
  $app.innerHTML = `<main class="results"><div class="wrap"><p><a href="#/${c.id}">&larr; ${esc(c.name)}</a></p>
    <h1 style="font-family:var(--display);letter-spacing:-.03em">${esc(c.name)}: photo file names</h1>
    <p class="count">Put these files in a folder called <b>photos</b> next to index.html. Only .jpg files. You need only the ones you want to replace.</p>
    <pre style="white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:1rem">${esc(c.id)}-main.jpg   (main photo of the city)\n${c.places.map((p, i) => c.id + "-" + (i + 1) + ".jpg   " + p.name).join("\n")}</pre></div></main>`;
}
function route(keepScroll) {
  stopHero();
  const pn = (forcedHash != null ? forcedHash : location.hash).match(/^#\/photo-names\/?([\w-]*)/);
  if (pn) { window.scrollTo(0, 0); return renderPhotoNames(pn[1]); }
  if (location.hash === "#/photo-test" || (forcedHash === "#/photo-test")) { window.scrollTo(0, 0); return renderPhotoTest(); }
  const id = ((forcedHash != null ? forcedHash : location.hash).match(/^#\/([\w-]+)/) || [])[1];
  const c = CITIES.find(c => c.id === id && ready(c));
  if (keepScroll !== true) window.scrollTo(0, 0);
  c ? renderCity(c) : renderHome();
}
window.addEventListener("hashchange", () => { forcedHash = null; route(); });
// Open city links ourselves, so they work even where plain #links are blocked (preview windows, in-app viewers)
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const h = a.getAttribute("href");
  forcedHash = null;
  try { if (location.hash !== h) location.hash = h; } catch (_) {}
  if (location.hash !== h) forcedHash = h;
  route();
});
route();
</script>
